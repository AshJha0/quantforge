[workspace]
resolver = "3"
members = ["crates/quantforge-core", "crates/quantforge-cli", "crates/quantforge-bench"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.5.0"

# Clippy pedantic is on for every crate. The allows below are deliberate for numerical code
# written against specifications: formula variable names (s, k, t, r, q) mirror the spec text,
# integer-to-float casts are on bounded day counts and grid sizes, and spec constants are kept
# digit-for-digit as printed, so separators would hinder comparison with the source.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
many_single_char_names = "allow"
similar_names = "allow"
unreadable_literal = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
float_cmp = "allow"
too_many_lines = "allow"
manual_midpoint = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
