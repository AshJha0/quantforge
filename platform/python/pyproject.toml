[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-adapters"
version = "0.1.0"
description = "QuantForge K-3 infrastructure adapters and simulated feed codecs (simulated; not a certified implementation; not connected to any venue)"
requires-python = ">=3.12"
# The feed codecs and the round-trip core are standard library only. Client libraries are optional extras and
# are never a dependency of the numerical libraries (specifications/12-platform/adapters.md section 4).
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow==26.0.1"]
grpc = ["grpcio==1.85.3"]
kafka = ["kafka-python==3.0.13"]
postgres = ["pg8000==1.31.6"]
all = ["pyarrow==26.0.1", "grpcio==1.85.3", "kafka-python==3.0.13", "pg8000==1.31.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantforge_adapters*"]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true
ignore_missing_imports = true
