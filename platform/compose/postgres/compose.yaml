# K-3 smoke stack (specifications/12-platform/adapters.md 2.2). Runs on GitHub Actions only (SC-2).
# Simulated; not a certified implementation; not connected to any venue.
services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: k3
      POSTGRES_PASSWORD: k3  # throwaway CI-only credential for a container that lives for one job
      POSTGRES_DB: k3
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "k3", "-d", "k3"]
      interval: 2s
      timeout: 3s
      retries: 60
