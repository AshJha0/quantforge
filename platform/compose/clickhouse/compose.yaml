# K-3 smoke stack (specifications/12-platform/adapters.md 2.2). Runs on GitHub Actions only (SC-2).
# Simulated; not a certified implementation; not connected to any venue.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_USER: k3
      CLICKHOUSE_PASSWORD: k3  # throwaway CI-only credential for a container that lives for one job
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "k3", "--password", "k3", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60
