default:
  absolute: 1.0e-12
  relative: 1.0e-10
  note: "Illustrative defaults only; every production test class must define justified tolerances."
classes:
  date_and_convention:
    exact: true
  simple_analytic:
    absolute: 1.0e-12
    relative: 1.0e-10
  interpolation:
    absolute: 1.0e-10
    relative: 1.0e-8
  calibration:
    absolute: 1.0e-8
    relative: 1.0e-6
  monte_carlo:
    method: "statistical confidence interval and fixed-seed reproducibility"
