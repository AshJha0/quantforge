name: Repo gates
# Cheap repository-wide gates on every pull request and push to main (about a minute, standard library only):
#   - hygiene (plan 13.2 E11): no tracked file over 1 MB unless in tools/large_files_allow.txt; no empty
#     placeholder packages;
#   - model register (plan 12.2 A2) and convergence rule (Q5b) ratchets over
#     conformance/quality/governance_baseline.json;
#   - build and test leftovers stay ignored (plan 12.2 G9);
#   - docs status (tools/check_docs_status.py): curve table rows against the name map, release wording against tags;
#   - red scheduled workflows (tools/check_scheduled_runs.py): each must be named in docs/known-issues.md (reads the API).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # tools/check_scheduled_runs.py reads the last scheduled run of each workflow on main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: repo-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true  # the docs check reads release tags
      - run: python3 tools/check_hygiene.py
      - name: unique job names and required-check list (R6-15)
        run: python3 tools/check_job_names.py
      - name: E9 fixed-seed Monte Carlo hash (R6-15)
        run: python3 tools/check_mc_hash.py --self-test
      - name: per-file coverage gate self-test (R6-26)
        run: python3 tools/test_coverage_gate.py
      - name: mutation stages map every stage (R6-14)
        run: python3 conformance/mutation/check_stages.py && python3 conformance/mutation/test_gates.py
      - name: golden case figures by class (R6-12)
        run: python3 tools/case_figures.py --check
      - name: references page lists every spec source (R6-17)
        run: python3 tools/build_references.py --check && python3 tools/test_build_references.py
      - name: E1 error-case coverage, every operation with a Real input has an E1 golden (J0B)
        run: python3 tools/check_e1_coverage.py
      - name: stage G E1 goldens and cpp26 cli_cases.inc are their generators' output (KR step 9)
        run: python3 oracle/python/gen_stage_f_e1.py G --check && python3 cpp26/tests/gen_cli_cases.py --check
      - name: sbim placeholder table is the generator's output (K-8h, KR-130)
        run: python3 tools/test_sbim_placeholder.py
      - name: stage K share figures in docs match oracle/OUTSIDE_SHARES.json (KF-3, KF-13, KF-18)
        run: python3 tools/check_share_figures.py --self-test && python3 tools/check_share_figures.py
      - name: generated status ladder page is current (KF-18)
        run: python3 tools/validation/status_ladder.py --check
      - name: K-7 release evidence checks, each first failing its planted faults (KR-224, KR-223, KR-225; confirmed 2026-11-20)
        run: |
          python3 tools/validation/model_reports.py --self-test && python3 tools/validation/model_reports.py --check
          python3 tools/results_page.py --self-test && python3 tools/results_page.py --check
          python3 tools/check_known_issues.py --self-test && python3 tools/check_known_issues.py
          python3 tools/check_runbooks.py --self-test && python3 tools/check_runbooks.py
          python3 tools/check_examples.py --self-test && python3 tools/check_examples.py --static
          python3 tools/release_verify.py --self-test
          python3 tools/check_ruleset.py --self-test
          python3 tools/check_versions.py --self-test && python3 tools/check_versions.py
      - name: every red scheduled workflow on main has an open known-issues row (K-9 review finding 1)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_scheduled_runs.py --self-test && python3 tools/check_scheduled_runs.py
      - name: K-3 libraries name no adapter, after the planted faults; feed fixtures current (KR-281; confirmed 2026-11-20)
        run: |
          python3 tools/check_adapter_deps.py --self-test && python3 tools/check_adapter_deps.py
          python3 tools/adapters/build_feed_fixtures.py --check
      - run: python3 tools/quality_gate.py --check-register --check-specs --check-docs
      - name: ignores (G9)
        run: |
          for p in python/quantforge.egg-info/PKG-INFO python/.hypothesis/examples python/.benchmarks/x; do
            git check-ignore -q "$p" || { echo "::error::$p is not ignored"; exit 1; }
          done

  preregs:
    name: research-preregs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check (d) runs git show <writing commit>:research/holdout_runs.csv; a shallow clone lacks it
      - name: fetch forward-log (the holdout scan reads origin/forward-log; without it the log part is skipped)
        run: git fetch --no-tags --depth=1 origin forward-log:refs/remotes/origin/forward-log
      - name: preregs, amendments and holdout scan (R6-19)
        run: python3 research/test_preregs.py
