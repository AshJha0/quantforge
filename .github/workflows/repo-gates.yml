name: Repo gates
# Cheap repository-wide gates on every pull request and push to main (about a minute, standard library only):
#   - hygiene (plan 13.2 E11): no tracked file over 1 MB unless in tools/large_files_allow.txt; no empty
#     placeholder packages;
#   - model register (plan 12.2 A2) and convergence rule (Q5b) ratchets over
#     conformance/quality/governance_baseline.json;
#   - build and test leftovers stay ignored (plan 12.2 G9);
#   - docs status (tools/check_docs_status.py): curve table rows against the name map, release wording against tags.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    name: repo-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true  # the docs check reads release tags
      - run: python3 tools/check_hygiene.py
      - name: unique job names and required-check list (R6-15)
        run: python3 tools/check_job_names.py
      - name: E9 fixed-seed Monte Carlo hash (R6-15)
        run: python3 tools/check_mc_hash.py --self-test
      - name: mutation stages map every stage (R6-14)
        run: python3 conformance/mutation/check_stages.py && python3 conformance/mutation/test_gates.py
      - name: golden case figures by class (R6-12)
        run: python3 tools/case_figures.py --check
      - name: references page lists every spec source (R6-17)
        run: python3 tools/build_references.py --check && python3 tools/test_build_references.py
      - run: python3 tools/quality_gate.py --check-register --check-specs --check-docs
      - name: ignores (G9)
        run: |
          for p in python/quantforge.egg-info/PKG-INFO python/.hypothesis/examples python/.benchmarks/x; do
            git check-ignore -q "$p" || { echo "::error::$p is not ignored"; exit 1; }
          done
