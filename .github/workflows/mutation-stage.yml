name: Mutation by stage
# Per-stage mutation report (plan 11.5.6) and the core-maths mutation gate (plan 12.2 G6, 13.2 E10).
#  - Pull requests: incremental. Only modules (from any stage in conformance/mutation/stages.json) whose
#    target file the PR changes, with a small sample per module, gated at 80%. A PR touching no mapped
#    module runs the plan job alone (seconds).
#  - Weekly and manual: every module of one stage (default F) in all four languages, scored against the
#    stage target. The weekly run gates; a manual run gates only when asked.
on:
  pull_request:
    paths: ['cpp26/src/**', 'java25/src/main/**', 'python/quantforge_core/**', 'rust/crates/*/src/**',
            'conformance/mutation/**', '.github/workflows/mutation-stage.yml']
  schedule:
    - cron: '41 5 * * 0'
  workflow_dispatch:
    inputs:
      stage:
        default: F
      max:
        description: 'mutants sampled per module (python, rust, cpp)'
        default: '40'
      gate:
        description: 'fail the run if the stage is below its target'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  STAGE: ${{ github.event_name == 'pull_request' && 'PR' || inputs.stage || 'F' }}
  MAX: ${{ github.event_name == 'pull_request' && '12' || inputs.max || '40' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: m
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$STAGE" = PR ]; then
            git diff --name-only "$BASE...$HEAD_SHA" > changed.txt
            python3 conformance/mutation/plan_matrix.py --changed changed.txt --stages-out pr-stages.json >> "$GITHUB_OUTPUT"
          else
            python3 conformance/mutation/plan_matrix.py --stage "$STAGE" >> "$GITHUB_OUTPUT"
            echo '{}' > pr-stages.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: pr-stages.json
  mutate:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      SUITE: ${{ matrix.suite }}
      OUT: results/${{ matrix.lang }}--${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p results
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - if: matrix.lang == 'java'
        run: |
          mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage "-DtargetClasses=$TARGET" -DoutputFormats=XML -DtimestampedReports=false
          cp target/pit-reports/mutations.xml "../$OUT.xml"
        working-directory: java25
      - if: matrix.lang == 'cpp'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e TARGET -e SUITE -e MAX -e OUT gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b \
            bash -c 'apt-get update -qq && apt-get install -y -qq cmake ninja-build python3 >/dev/null && python3 conformance/mutation/cpp_mutants.py --file "$TARGET" --suite "$SUITE" --max "$MAX" --unit --out "$OUT.json"'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.lang == 'python'
      - if: matrix.lang == 'rust'
        run: |
          (cd rust && rustup show)
          cargo install cargo-mutants --version 27.1.0 --locked
      - if: matrix.lang == 'python' || matrix.lang == 'rust'
        run: python3 conformance/mutation/golden_mutants.py --impl "${{ matrix.lang }}" --target "$TARGET" --suite "$SUITE" --max "$MAX" --out "$OUT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.lang }}-${{ matrix.module }}
          path: results/
          if-no-files-found: ignore
  report:
    needs: [plan, mutate]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: mutation-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
      - name: Stage report
        env:
          GATE: ${{ (github.event_name != 'workflow_dispatch' || inputs.gate) && '--gate' || '' }}
        run: |
          STAGES=conformance/mutation/stages.json
          [ "$STAGE" = PR ] && STAGES=pr-stages.json
          # GATE is intentionally unquoted: empty means no flag.
          # shellcheck disable=SC2086
          python3 conformance/mutation/stage_report.py --stage "$STAGE" --stages "$STAGES" --results results --out mutation-report.md $GATE
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ env.STAGE }}
          path: mutation-report.md
