name: Mutation by stage
# Per-stage mutation report (plan 11.5.6) and the core-maths mutation gate (plan 12.2 G6, 13.2 E10).
#  - Pull requests: incremental. Only modules (from any stage in conformance/mutation/stages.json) whose
#    target file the PR changes, with a small sample per module, gated at 80%. A PR touching no mapped
#    module runs the plan job alone (seconds).
#  - Weekly: every module of every stage (stage ALL, R6-14) in all four languages, a fresh seeded sample of
#    MAX=40 mutants per module (seed = the run number, printed in the report), gated on a point estimate of
#    80% and a 95% Wilson lower bound of 65% per module-language (reasons.json lists countersigned exceptions).
#  - Manual: one stage (default ALL); gates only when asked.
#  plan_matrix.py exits 1 when a full-stage run plans nothing: at v0.8.0 stage F planned an empty matrix and
#  the run passed (review finding 5). check_stages.py and test_gates.py run in repo-gates.yml.
#  - Manual with `paths`: planned as a pull request touching those files (for example one Rust module).
on:
  pull_request:
    paths: ['cpp26/src/**', 'java25/src/main/**', 'python/quantforge_core/**', 'rust/crates/*/src/**',
            'conformance/mutation/**', '.github/workflows/mutation-stage.yml']
  schedule:
    - cron: '41 5 * * 0'
  workflow_dispatch:
    inputs:
      stage:
        default: ALL
      seed:
        description: 'sample seed (default: the run number)'
        default: ''
      max:
        description: 'mutants sampled per module (python, rust, cpp)'
        default: '40'
      gate:
        description: 'fail the run if the stage is below its target'
        type: boolean
        default: false
      paths:
        description: 'space-separated source paths: plan as a pull request touching them (ignores stage)'
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  STAGE: ${{ (github.event_name == 'pull_request' || inputs.paths) && 'PR' || inputs.stage || 'ALL' }}
  SEED: ${{ inputs.seed || github.run_number }}
  MAX: ${{ github.event_name == 'pull_request' && '12' || inputs.max || '40' }}
jobs:
  plan:
    name: mutation-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: m
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATHS: ${{ inputs.paths }}
        run: |
          if [ "$STAGE" = PR ]; then
            if [ -n "$PATHS" ]; then
              # shellcheck disable=SC2086  # word splitting of the space-separated list is intended
              printf '%s\n' $PATHS > changed.txt
            else
              git diff --name-only "$BASE...$HEAD_SHA" > changed.txt
            fi
            python3 conformance/mutation/plan_matrix.py --changed changed.txt --stages-out pr-stages.json >> "$GITHUB_OUTPUT"
          else
            python3 conformance/mutation/plan_matrix.py --stage "$STAGE" >> "$GITHUB_OUTPUT"
            echo '{}' > pr-stages.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: pr-stages.json
  mutate:
    name: mutation-mutate (${{ matrix.lang }} ${{ matrix.module }}${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    # Rust used to run cargo-mutants over every mutant of a file (1258 in exotics.rs) and hit 180
    # minutes (run 43100924809). golden_mutants.py now lists the mutants and tests only the sample
    # of MAX, so a Rust module takes roughly MAX x (incremental test build + tests + release build +
    # golden run), split over plan_matrix.RUST_SHARDS jobs. Keep the limit well clear of the 360-minute runner cap.
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      SUITE: ${{ matrix.suite }}
      OUT: results/${{ matrix.lang }}--${{ matrix.module }}${{ matrix.part }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p results
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - if: matrix.lang == 'java'
        run: |
          mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage "-DtargetClasses=$TARGET" -DoutputFormats=XML -DtimestampedReports=false
          cp target/pit-reports/mutations.xml "../$OUT.xml"
        working-directory: java25
      - if: matrix.lang == 'cpp'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e TARGET -e SUITE -e MAX -e SEED -e OUT gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b \
            bash -c 'apt-get update -qq && apt-get install -y -qq cmake ninja-build python3 >/dev/null && python3 conformance/mutation/cpp_mutants.py --file "$TARGET" --suite "$SUITE" --max "$MAX" --seed "$SEED" --unit --out "$OUT.json"'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.lang == 'python'
      - if: matrix.lang == 'rust'
        run: |
          (cd rust && rustup show)
          cargo install cargo-mutants --version 27.1.0 --locked
          # Memory cap (8 GiB of address space) for every test binary cargo runs and for the golden
          # run. Mutants such as bonds.rs `periods` `k += 1` -> `k *= 1` (credit.rs `periods` alike)
          # push to a Vec forever; uncapped, they exhaust the runner's memory and the runner agent
          # dies ("runner has received a shutdown signal", exit 143) before any result is written,
          # as in PR #31. Capped, the allocation fails, the test aborts and the mutant counts as
          # killed. rustc and the release build are not capped.
          printf '#!/bin/sh\nulimit -v 8388608\nexec "$@"\n' > "$RUNNER_TEMP/memcap"
          chmod +x "$RUNNER_TEMP/memcap"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/memcap" >> "$GITHUB_ENV"
          echo "QF_MUTANT_AS=8589934592" >> "$GITHUB_ENV"
      - if: matrix.lang == 'python' || matrix.lang == 'rust'
        run: python3 conformance/mutation/golden_mutants.py --impl "${{ matrix.lang }}" --target "$TARGET" --suite "$SUITE" --max "$MAX" --seed "$SEED" --shard "$SHARD" --out "$OUT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.lang }}-${{ matrix.module }}${{ matrix.part }}
          path: results/
          if-no-files-found: ignore
  report:
    name: mutation-report
    needs: [plan, mutate]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: mutation-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
      - name: Stage report
        env:
          GATE: ${{ (github.event_name != 'workflow_dispatch' || inputs.gate) && '--gate' || '' }}
        run: |
          STAGES=conformance/mutation/stages.json
          [ "$STAGE" = PR ] && STAGES=pr-stages.json
          # GATE is intentionally unquoted: empty means no flag.
          # shellcheck disable=SC2086
          python3 conformance/mutation/stage_report.py --stage "$STAGE" --stages "$STAGES" --results results --out mutation-report.md $GATE
          echo "Sample seed: $SEED; mutants per module: $MAX" >> mutation-report.md
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ env.STAGE }}
          path: mutation-report.md
