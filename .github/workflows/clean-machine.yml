name: Clean machine
# K-7 clean-machine run (plan 14.8; specifications/12-platform/release-evidence.md check RE1, ruling KR-222,
# confirmed 2026-11-20; not yet met until these runs are green). tutorial.yml already runs every tutorial page and every example in all four languages on a fresh Linux
# runner. This workflow adds fresh Windows and macOS runners for the Python build, from CONTRIBUTING's commands only
# (install uv, `uv sync --locked --project python`), with no cache: every tutorial page's Python block
# (tools/check_tutorial.py) and every example case and script (tools/check_examples.py). Rust, Java and C++ on
# Windows and macOS are not run here: cross-platform.yml builds them on those runners for the conformance suite.
# Not yet run: it runs on a release tag, weekly, or by hand.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clean-machine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: clean-machine-python-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --project python
      - run: uv run --no-project python tools/check_tutorial.py --lang python
      - run: uv run --no-project python tools/check_examples.py --lang python
