name: Conformance
# Linux only, because CI minutes are capped. Each job builds one CLI and runs the neutral runner.
# The scope job looks at the changed paths, so a change inside one language runs only that language.
# Shared inputs run everything, and so does any doubt about what changed.
on:
  push:
    branches: [main]
    paths:
      - 'java25/**'
      - 'cpp26/**'
      - 'python/**'
      - 'rust/**'
      - 'conformance/**'
      - 'datasets/**'
      - 'specifications/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    paths:
      - 'java25/**'
      - 'cpp26/**'
      - 'python/**'
      - 'rust/**'
      - 'conformance/**'
      - 'datasets/**'
      - 'specifications/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      java: ${{ steps.paths.outputs.java }}
      cpp: ${{ steps.paths.outputs.cpp }}
      python: ${{ steps.paths.outputs.python }}
      rust: ${{ steps.paths.outputs.rust }}
      stage_d: ${{ steps.paths.outputs.stage_d }}
      stage_e: ${{ steps.paths.outputs.stage_e }}
      golden: ${{ steps.paths.outputs.golden }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          shared=false java=false cpp=false python=false rust=false stage_d=false stage_e=false
          base=
          [ "$EVENT" = pull_request ] && base=HEAD^1 # the merge ref's first parent is the base branch
          [ "$EVENT" = push ] && base=$BEFORE
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            for f in $files; do
              case "$f" in
                java25/*) java=true ;;
                cpp26/*) cpp=true ;;
                python/*) python=true ;;
                rust/*) rust=true ;;
                datasets/golden/stage_d/*|specifications/*stage-d*) stage_d=true ;;
                datasets/golden/stage_e/*|specifications/*stage-e*) stage_e=true ;;
                conformance/runner/*|conformance/tolerances/*|datasets/*|specifications/*|.github/workflows/conformance.yml) shared=true ;;
              esac
            done
          else
            shared=true
          fi
          # Stage slots: a change only to one stage's goldens or rulings runs every language on that stage's goldens alone.
          # Both stages at once, or a stage plus anything else, runs everything.
          golden=datasets/golden
          langs="$shared$java$cpp$python$rust"
          if [ "$stage_d$stage_e" = truefalse ] && [ "$langs" = falsefalsefalsefalsefalse ]; then
            golden=datasets/golden/stage_d java=true cpp=true python=true rust=true
          elif [ "$stage_d$stage_e" = falsetrue ] && [ "$langs" = falsefalsefalsefalsefalse ]; then
            golden=datasets/golden/stage_e java=true cpp=true python=true rust=true
          elif [ "$stage_d" = true ] || [ "$stage_e" = true ]; then
            shared=true
          fi
          echo "shared=$shared java=$java cpp=$cpp python=$python rust=$rust stage_d=$stage_d stage_e=$stage_e golden=$golden"
          { echo "shared=$shared"; echo "java=$java"; echo "cpp=$cpp"; echo "python=$python"; echo "rust=$rust"; echo "stage_d=$stage_d"; echo "stage_e=$stage_e"; echo "golden=$golden"; } >> "$GITHUB_OUTPUT"
  runner-self-test:
    needs: scope
    if: needs.scope.outputs.shared == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 conformance/runner/test_runner.py
  java:
    needs: scope
    if: needs.scope.outputs.shared == 'true' || needs.scope.outputs.java == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - run: mvn -B -DskipTests package
        working-directory: java25
      - run: python3 conformance/runner/runner.py --impl java --golden "$GOLDEN"
        env:
          GOLDEN: ${{ needs.scope.outputs.golden }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: conformance-java
          path: conformance/reports/
  cpp:
    needs: scope
    if: needs.scope.outputs.shared == 'true' || needs.scope.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    container: gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y cmake ninja-build python3
      - run: cmake -S cpp26 -B cpp26/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build cpp26/build --parallel
      - run: python3 conformance/runner/runner.py --impl cpp --golden "$GOLDEN"
        env:
          GOLDEN: ${{ needs.scope.outputs.golden }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: conformance-cpp
          path: conformance/reports/
  python:
    needs: scope
    if: needs.scope.outputs.shared == 'true' || needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --project python
      - run: python3 conformance/runner/runner.py --impl python --golden "$GOLDEN"
        env:
          GOLDEN: ${{ needs.scope.outputs.golden }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: conformance-python
          path: conformance/reports/
  rust:
    needs: scope
    if: needs.scope.outputs.shared == 'true' || needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: conformance-rust-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
      - run: rustup show
        working-directory: rust
      - run: cargo build --release -p quantforge-cli
        working-directory: rust
      - run: python3 conformance/runner/runner.py --impl rust --golden "$GOLDEN"
        env:
          GOLDEN: ${{ needs.scope.outputs.golden }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: conformance-rust
          path: conformance/reports/
