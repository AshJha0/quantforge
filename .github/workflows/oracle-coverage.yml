name: Outside-oracle coverage
# R6-13 (decision D6): every register (D, E, F; G and I hold suite counts) regenerated or checked here, with a
# diff against the committed copy, and tools/outside_shares.py --check applies the D6 classes and the 60% floor on
# value-checked cases only (owner 2026-11-12; no dated-plan fallback) and fails when a golden suite is missing from its register.
# Plan rule 11.2.5 and R1 item 1: stage D outside-oracle share must stay at or above 60%.
# oracle/python/outside_d.py rebuilds every stage D case in QuantLib 1.44 (pinned in oracle/python/uv.lock,
# installed from PyPI, free) and exits 1 below the floor. --frozen, not --locked: uv.lock still records the
# project's own version as 0.2.0, which --locked rejects; every dependency pin, QuantLib 1.44 included, is used as locked. A light PR check: it runs only when the oracle,
# the golden datasets or the specifications change, and needs no CLI build.
on:
  push:
    branches: [main]
    paths: ['oracle/**', 'datasets/**', 'specifications/**', 'conformance/tolerances/**', 'conformance/runner/runner.py', 'tools/outside_shares.py', 'tools/test_outside_shares.py', '.github/workflows/oracle-coverage.yml']
  pull_request:
    paths: ['oracle/**', 'datasets/**', 'specifications/**', 'conformance/tolerances/**', 'conformance/runner/runner.py', 'tools/outside_shares.py', 'tools/test_outside_shares.py', '.github/workflows/oracle-coverage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  outside-d:
    name: oracle-outside-registers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Coverage floor (exits 1 below 60%)
        shell: bash # explicit bash adds pipefail, so tee keeps the exit status
        run: uv run --frozen python -W ignore outside_d.py | tee "$RUNNER_TEMP/coverage.md"
        working-directory: oracle/python
      # Stage E and F registers: job oracle-outside-registers-ef below (Windows; owner approved 2026-11-12).
      - name: Regenerate the stage G per-case register (QuantLib FD, tree, MC; about 20 minutes)
        shell: bash
        run: |
          git show HEAD:oracle/OUTSIDE_G_R6.json > "$RUNNER_TEMP/g_committed.json"
          uv run --frozen python -W ignore outside_g_r6.py
          uv run --frozen python -W ignore outside_g_barrier_r6.py
        working-directory: oracle/python
      - name: Stage G per-case verdicts match the committed copy
        # floats from QuantLib's MC and FD may differ in the last digits across platforms; the verdicts may not
        run: |
          python3 - "$RUNNER_TEMP/g_committed.json" oracle/OUTSIDE_G_R6.json <<'EOF'
          import json, sys
          v = lambda p: {s: {c["case_id"]: c["pass"] for c in d["cases"]} for s, d in json.load(open(p))["suites"].items()}
          a, b = v(sys.argv[1]), v(sys.argv[2])
          if a != b:
              print("::error::stage G per-case outside verdicts differ from a fresh run:", {s: {k: (a.get(s, {}).get(k), x) for k, x in b[s].items() if a.get(s, {}).get(k) != x} for s in b})
              sys.exit(1)
          EOF
          git checkout -- oracle/OUTSIDE_G_R6.json
      - name: Stage F blind re-derivation judged at each golden's tolerance (four no-library classes only)
        # oracle/rederivation/results.json is the frozen output of a model blind to the goldens; disagreements are
        # printed (spec-lane findings), and the committed verdict register must equal a fresh judgement
        run: |
          python3 oracle/python/compare_rederivation.py oracle/rederivation/results.json --source "blind re-derivation, Sonnet 5.5, 2026-11-12" --write
          git diff --exit-code -- oracle/REDERIVATION_REGISTER.json
      - name: Show which oracle files this job rewrote (diagnostic)
        run: |
          git status --short -- oracle/
          git diff --stat -- oracle/
          git diff -U0 -- oracle/outside_register.json | head -60
      - name: D6 shares, floor and register-against-golden check (R6-13)
        run: |
          python3 tools/test_outside_shares.py
          python3 tools/outside_shares.py --check
          cat oracle/OUTSIDE_SHARES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY" || true

  outside-ef:
    # Stage E and F registers run on Windows: the Linux QuantLib 1.44 wheel's SymmetricSchurDecomposition returned
    # garbage on CI (min eigenvalue 5.8e180 or denormals for corr_e-0003/0005/0009, then MemoryError), while the
    # Windows wheel decomposes every matrix; the committed registers are generated on Windows (PR 35).
    name: oracle-outside-registers-ef
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Regenerate the stage E and F registers
        shell: bash
        run: |
          uv run --frozen python -W ignore outside_e_a.py
          uv run --frozen python -W ignore outside_e_b.py
          uv run --frozen python -W ignore outside_f.py
        working-directory: oracle/python
      - name: Registers match the committed copies
        shell: bash
        run: |
          if ! git diff --exit-code -- oracle/outside_register*.json; then
            echo "::error::an outside register differs from a fresh run; rerun the outside_*.py scripts and commit the registers"
            exit 1
          fi
