name: Docs
# Builds the static site and keeps it as a 7-day artifact. GitHub Pages on a private repository needs
# a paid plan, so nothing is deployed. Download the artifact and open index.html.
on:
  push:
    branches: [main]
    paths: ['**.md', 'tools/build_site.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', 'tools/build_site.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project --with markdown==3.11.2 python tools/build_site.py --out site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7
