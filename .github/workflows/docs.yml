name: Docs
# Checks the Curves gallery against the Python CLI, builds the static site and keeps it as a 7-day artifact. On a public repository, a push to main also
# deploys it to GitHub Pages. The deploy job skips while the repository is private, because Pages on a
# private repository needs a paid plan. Settings > Pages > Source must be set to GitHub Actions.
# K-7 check RE9 (G10, ruling KR-227, confirmed 2026-11-20): docs-site-view opens every page of the built site in
# headless Chrome at 1280 px and at 375 px (light and dark) and fails if a page is wider than the window or a
# Mermaid diagram did not render (tools/check_site_view.py, after its planted faults fail); docs-site also runs
# pa11y AA a second time on a copy of the site with the dark colours forced on. docs-site-view-summary writes the
# table the release notes quote (artifact site-view, file site-view.md). Added 2026-11-20 on branch k-v1-k7b; not
# yet run in CI.
# KR-227 read strictly (coordinator, 2026-11-20): docs-site-a11y runs pa11y AA (pa11y-ci 3.1.0, as in docs-site) on
# every page of the built site, light and dark, in 12 shards (tools/check_site_a11y.py), after a planted contrast
# failure is reported; docs-site-a11y-summary fails if any shard failed or any page was not reported on, and writes
# the counts for the release notes (artifact site-a11y, a11y-summary.md). Added 2026-11-20 on branch k-v1-a11y, held
# out of pull request #63 while tutorials 36 and 39 failed, restored 2026-11-21 on branch k-v1-a11y2 with the fix
# (pre code as one block: axe-core 4.2.4 color-contrast threw on those two pages, run 44805977858).
on:
  push:
    branches: [main]
    paths: ['**.md', 'tools/build_site.py', 'tools/build_gallery.py', 'tools/build_references.py', 'specifications/**', 'tools/site_home.html', 'docs/curves/data/**', 'examples/**', 'python/**', 'datasets/golden/stage_b/**', 'datasets/golden/stage_c/**', 'datasets/golden/stage_d/**', 'datasets/golden/stage_e/**', 'datasets/golden/stage_e_b/**', 'tools/test_tools.py', 'tools/check_cookbook.py', 'tools/test_check_cookbook.py', 'tools/check_quickstart.py', 'tools/doctor.py', 'tools/forward-log/**', 'tools/recorder/**', 'tools/workflows/**', 'tools/gallery_real.py', 'tools/gallery_e.py', 'tools/gallery_j.py', 'examples/research_workflow_j.json', 'tools/site_facts.json', 'tools/site_figures.py', 'tools/status_glance.py', 'tools/check_md_anchors.py', 'datasets/golden/**', 'conformance/runner/runner.py', '.pa11yci.json', 'tools/check_site_view.py', 'tools/check_site_a11y.py', 'tools/a11y_detail.js', 'tools/quality_gate.py', 'conformance/quality/**', 'conformance/mutation/stages.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', 'tools/build_site.py', 'tools/build_gallery.py', 'tools/build_references.py', 'specifications/**', 'tools/site_home.html', 'docs/curves/data/**', 'examples/**', 'python/**', 'datasets/golden/stage_b/**', 'datasets/golden/stage_c/**', 'datasets/golden/stage_d/**', 'datasets/golden/stage_e/**', 'datasets/golden/stage_e_b/**', 'tools/test_tools.py', 'tools/check_cookbook.py', 'tools/test_check_cookbook.py', 'tools/check_quickstart.py', 'tools/doctor.py', 'tools/forward-log/**', 'tools/recorder/**', 'tools/workflows/**', 'tools/gallery_real.py', 'tools/gallery_e.py', 'tools/gallery_j.py', 'examples/research_workflow_j.json', 'tools/site_facts.json', 'tools/site_figures.py', 'tools/status_glance.py', 'tools/check_md_anchors.py', 'datasets/golden/**', 'conformance/runner/runner.py', '.pa11yci.json', 'tools/check_site_view.py', 'tools/check_site_a11y.py', 'tools/a11y_detail.js', 'tools/quality_gate.py', 'conformance/quality/**', 'conformance/mutation/stages.json', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    name: docs-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --project python
      - run: python3 tools/test_tools.py
      # COOKBOOK recipes marked cookbook:run still print what their cookbook:expect comment lists (needs the uv sync above)
      - run: python3 tools/test_check_cookbook.py && python3 tools/check_cookbook.py
      - run: python3 tools/check_quickstart.py  # README quick start still prints what it shows (E8)
      - run: python3 tools/build_gallery.py --check
      - run: python3 tools/build_references.py --check  # docs/references.md matches the specs' Sources sections
      # Also fails if the home stage table or site_facts.json disagree with ROADMAP.md (plan 13.2 E7)
      - run: uv run --no-project --with markdown==3.11.2 python tools/build_site.py --out site
      # Relative links and #anchors in every tracked .md and every href in the built site (build_site checks files only)
      - run: python3 tools/check_md_anchors.py --site site
      # Static WCAG pre-check of every built page (lang, title, alt, names, ids, headings, table headers, focusable
      # scrolling boxes, colour tokens); its planted faults fail first (KR-227)
      - run: python3 tools/check_site_a11y.py --self-test && python3 tools/check_site_a11y.py --static site
      # WCAG 2 AA, zero errors, on home, LEARN, COOKBOOK and the Curves gallery (plan 13.2 E6)
      - name: accessibility (pa11y-ci, axe and HTML_CodeSniffer)
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site >/dev/null 2>&1 &
          npx --yes pa11y-ci@3.1.0 --config .pa11yci.json
      # The same pages in dark mode (K-7, KR-227): --dark-copy applies the prefers-color-scheme: dark rules
      # unconditionally and fails if it finds none to force
      - name: accessibility in dark mode (pa11y-ci on the dark copy)
        run: |
          python3 tools/check_site_view.py --dark-copy site "$RUNNER_TEMP/site-dark"
          python3 -m http.server 8001 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site-dark" >/dev/null 2>&1 &
          sed 's#127.0.0.1:8000/#127.0.0.1:8001/#' .pa11yci.json > "$RUNNER_TEMP/pa11y-dark.json"
          npx --yes pa11y-ci@3.1.0 --config "$RUNNER_TEMP/pa11y-dark.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/
          retention-days: 7
      - if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
  site-view:
    name: docs-site-view
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --no-project --with markdown==3.11.2 python tools/build_site.py --out site
      # Playwright drives the runner's installed Google Chrome (--channel chrome): no browser download
      - name: site check self-test (planted 600 px element and broken Mermaid block must fail)
        run: uv run --no-project --with playwright==1.64.1 python tools/check_site_view.py --self-test
      - name: site check, every page of the shard at 1280 and 375 px, light and dark
        run: >-
          uv run --no-project --with playwright==1.64.1 python tools/check_site_view.py --site site
          --shard ${{ matrix.shard }} --out site-view --screenshots site-view/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-view-shard-${{ strategy.job-index }}
          path: site-view/
          retention-days: 30
  site-view-summary:
    name: docs-site-view-summary
    needs: site-view
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-view-shard-*
          merge-multiple: true
          path: site-view
      # One table for every page; fails if any page failed or no shard wrote a result
      - name: merge the shard results
        run: |
          set -o pipefail
          python3 tools/check_site_view.py --merge site-view | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-view
          path: site-view/
          retention-days: 90
  # KR-227 read strictly (coordinator, 2026-11-20): pa11y AA on EVERY page of the built site, light and dark.
  # tools/check_site_a11y.py writes each shard's URL list from the built site; 2 modes x 6 shards of about 137 pages,
  # pa11y-ci at concurrency 1 in batches of 10 (tools/check_site_a11y.py --run), expected about 8 to 15 minutes a job against 45.
  # Each job first runs pa11y-ci on a planted contrast failure, which must be reported (--check-plant).
  site-a11y:
    name: docs-site-a11y
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [light, dark]
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: python3 tools/check_site_a11y.py --self-test
      - run: uv run --no-project --with markdown==3.11.2 python tools/build_site.py --out site
      # pa11y-ci runs through check_site_a11y.py --run: batches of 10 pages with a fresh browser each, and a page
      # whose result is a browser or protocol failure (not a WCAG error) is run again on its own, at most twice
      # (run 44791215797: one Chromium crash failed every later page of its pa11y-ci run)
      - name: planted contrast failure must be reported by pa11y-ci
        run: |
          mkdir -p a11y
          python3 tools/check_site_a11y.py --plant "$RUNNER_TEMP/plant" --base http://127.0.0.1:8002
          python3 -m http.server 8002 --bind 127.0.0.1 --directory "$RUNNER_TEMP/plant" >/dev/null 2>&1 &
          sleep 1
          rc=0
          python3 tools/check_site_a11y.py --run "$RUNNER_TEMP/plant/pa11y-plant.json" --results a11y/plant-results.json --raw a11y/raw-plant || rc=$?
          test "$rc" -ne 0 || { echo "pa11y-ci found nothing on the planted contrast failure"; exit 1; }
          python3 tools/check_site_a11y.py --check-plant a11y/plant-results.json --base http://127.0.0.1:8002
      - name: pa11y AA on every page of the shard (${{ matrix.mode }} ${{ matrix.shard }})
        env:
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
        run: |
          dir=site
          if [ "$MODE" = dark ]; then
            python3 tools/check_site_view.py --dark-copy site "$RUNNER_TEMP/site-dark"
            dir="$RUNNER_TEMP/site-dark"
          fi
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$dir" >/dev/null 2>&1 &
          sleep 1
          python3 tools/check_site_a11y.py --urls --site site --shard "$SHARD" --mode "$MODE" --base http://127.0.0.1:8000 --out a11y
          tag="$MODE-${SHARD%/*}of${SHARD#*/}"
          python3 tools/check_site_a11y.py --run "a11y/pa11y-$tag.json" --results "a11y/a11y-$tag.results.json"             --raw "a11y/raw-$tag" --out "a11y/a11y-$tag.rc" || true
          test "$(cat "a11y/a11y-$tag.rc")" = 0
      # Diagnostic only: axe-core's own colour figures for up to four pages with a contrast error (those with no element named first)
      - name: contrast details on failure (diagnostic, not a verdict)
        if: failure()
        run: |
          nm=$(dirname "$(dirname "$(find ~/.npm/_npx -path '*/node_modules/pa11y-ci/package.json' | head -1)")")
          urls=$(python3 -c "import glob,json; r={}; [r.update(json.load(open(f))['results']) for f in glob.glob('a11y/a11y-*.results.json')]; c=[(not any(x.get('code')=='color-contrast' and not x.get('selector') for x in v),u) for u,v in r.items() if any(x.get('code')=='color-contrast' for x in v)]; print(' '.join(u for _,u in sorted(c)[:4]))" || true)
          if [ -n "$urls" ]; then node tools/a11y_detail.js "$nm" $urls | tee a11y/contrast-detail.txt || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-a11y-${{ matrix.mode }}-${{ strategy.job-index }}
          path: a11y/
          retention-days: 30
  site-a11y-summary:
    name: docs-site-a11y-summary
    needs: site-a11y
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-a11y-*
          merge-multiple: true
          path: a11y
      # Fails if any shard failed or is missing, or any page of the site was not reported on; writes the counts the
      # release notes quote (artifact site-a11y, a11y-summary.md and a11y-summary.json)
      - name: merge the shard results
        run: |
          set -o pipefail
          python3 tools/check_site_a11y.py --merge a11y --shards 6 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-a11y
          path: a11y/
          retention-days: 90
  deploy:
    name: docs-deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
