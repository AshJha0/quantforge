name: Python
on:
  push:
    branches: [main]
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:  # every PR, so these can be required checks on main
  workflow_call:  # release.yml reruns this on a version tag
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .  # package strict; tests and benchmarks too (pyproject overrides)
      - run: uv run pytest
