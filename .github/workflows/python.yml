name: Python
on:
  push:
    branches: [main]
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:  # every PR, so these can be required checks on main
  workflow_call:  # release.yml reruns this on a version tag
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: python-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .  # whole python/ tree formatted in v0.9.0
      - run: uv run mypy .  # package strict; tests and benchmarks too (pyproject overrides)
      - run: uv run pytest
  daily-jobs-bytes:
    # The two daily jobs (paper ledger, daily curve run) write public, append-only rows from an ubuntu runner.
    # This job runs, on the same runner image, the tests that pin the canonical bytes and hashes of their rows and
    # the paper ledger's golden hashes, which were first computed on Windows. It must be green before the two
    # workflows are allowed to write their first row (specifications/12-platform, ruling KR-208).
    name: python-daily-jobs-bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/test_daily_jobs_bytes.py tests/test_paper_daily.py::test_goldens_pl_k -q
      # The scheduled jobs start the tools with the runner's own python3, not the project's: show that it can
      # load them and that it writes the same bytes.
      - run: python3 ../tools/paper_daily/canonical_selftest.py
