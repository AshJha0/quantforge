name: Low-latency book (H-9)
# H-9 harness on the Actions Linux runner (specifications/09-microstructure/low-latency-book.md; targets in
# low-latency-targets.md). Manual only; not a required check. The runner is shared and unpinned, so its figures
# are sanity checks against 3x the targets (HR-24), not the headline. Workload S is regenerated from core.rng seed
# 20261117 and its SHA-256 printed for comparison with the recorded hash.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Account-free Central fallback for HTTP 429 (CI only), as java25.yml
  MAVEN_ARGS: --settings ${{ github.workspace }}/java25/.mvn/ci-settings.xml
jobs:
  lowlat-bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build C++ harness
        run: |
          cmake -S cpp26 -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DQF_LOWLAT_BENCH=ON
          cmake --build build --target qf_lowlat_book -j4
      - name: Generate workload S
        run: |
          ./build/qf_lowlat_book gen S.bin
          sha256sum S.bin
      - name: C++ run (5 repeats, unpinned runner)
        run: ./build/qf_lowlat_book run S.bin 5 cpp_S.json
      - name: Rust run (5 repeats, unpinned runner)
        working-directory: rust
        run: cargo run --release -p quantforge-bench --bin lowlat_book -- ../S.bin 5 ../rust_S.json
      - name: Java run (5 repeats, unpinned runner)
        working-directory: java25
        run: |
          mvn -B -q -DskipTests compile
          mkdir -p target/lowlat
          javac -d target/lowlat -cp target/classes src/jmh/java/org/quantforge/bench/LowLatBook.java
          java -Xms2g -Xmx2g -cp target/classes:target/lowlat -Xlog:gc:file=../gc.log             -XX:StartFlightRecording=filename=../h9.jfr,settings=profile             org.quantforge.bench.LowLatBook ../S.bin 5 ../java_S.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lowlat-book-results
          path: |
            cpp_S.json
            rust_S.json
            java_S.json
            gc.log
            h9.jfr
