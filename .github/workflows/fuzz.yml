name: Fuzz
# Weekly and manual only, never on a pull request. Roughly 30 minutes a week across the four jobs.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzz time per language, in seconds
        default: '180'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Half the draws come from the current stage's goldens (conformance/quality/stage_e.json); no-op until they exist.
  FUZZ_ARGS: --seconds ${{ inputs.seconds || '180' }} --seed ${{ github.run_number }} --focus-config conformance/quality/stage_e.json
jobs:
  java:
    name: fuzz-java
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5"
          cache: maven
      - run: mvn -B -DskipTests package
        working-directory: java25
      - run: python3 conformance/fuzz/fuzz_cli.py --impl java $FUZZ_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-java
          path: conformance/reports/fuzz/
  cpp:
    name: fuzz-cpp
    runs-on: ubuntu-24.04
    container:
      image: gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y cmake ninja-build python3
      - run: cmake -S cpp26 -B cpp26/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF -DQF_SANITIZE=address,undefined,float-cast-overflow
      - run: cmake --build cpp26/build --parallel
      - run: python3 conformance/fuzz/fuzz_cli.py --impl cpp $FUZZ_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-cpp
          path: conformance/reports/fuzz/
  python:
    name: fuzz-python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --project python
      - run: python3 conformance/fuzz/fuzz_cli.py --impl python $FUZZ_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-python
          path: conformance/reports/fuzz/
  rust:
    name: fuzz-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
        working-directory: rust
      - run: cargo build --release -p quantforge-cli
        working-directory: rust
      - run: python3 conformance/fuzz/fuzz_cli.py --impl rust $FUZZ_ARGS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-rust
          path: conformance/reports/fuzz/
