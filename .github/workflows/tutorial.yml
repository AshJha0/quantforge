name: Tutorial
# Runs every code block of the tutorials (docs/getting-started/tutorial-*.md) on a fresh runner, one job per
# language, and fails if a block prints anything other than the lines a page shows (plan 13.2 E2). Page 1 builds
# each CLI and pages 2 to 16 reuse it. Tutorial 1's acceptance test is under 10 minutes per language from a cold
# start, so the jobs use no build cache; the timeout allows for the fifteen later pages.
on:
  push:
    branches: [main]
    paths: ['docs/getting-started/tutorial-*.md', 'examples/tutorial_*.py', 'examples/tutorials/**',
            'datasets/golden/stage_f/risk_f4.json', 'tools/check_tutorial.py',
            'python/**', 'rust/**', 'java25/**', 'cpp26/**', '.github/workflows/tutorial.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tutorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: python3 tools/check_tutorial.py --lang python
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_tutorial.py --lang rust
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: python3 tools/check_tutorial.py --lang java
  cpp:
    runs-on: ubuntu-24.04
    container: gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y cmake ninja-build python3
      - run: python3 tools/check_tutorial.py --lang cpp
