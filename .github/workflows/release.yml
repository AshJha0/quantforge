name: Release
# Runs on a vMAJOR.MINOR.PATCH tag (plan 13.1 E3; tags are semver from v0.5.0). It reruns the language CI, builds the
# artefacts, refuses a version that has no CHANGELOG.md section, and creates the GitHub release with GITHUB_TOKEN.
# Nothing is published to a package registry.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${BASH_REMATCH[1]}"
          grep -Eq "^## ${version//./\\.}([: ]|$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The section's text, up to the next "## " heading, becomes the release notes
          awk -v h="## $version" '/^## / { if (on) exit; c = substr($0, length(h) + 1, 1); if (index($0, h) == 1 && (c == "" || c == ":" || c == " ")) on = 1 } on' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
  python-ci:
    needs: changelog
    uses: ./.github/workflows/python.yml
  rust-ci:
    needs: changelog
    uses: ./.github/workflows/rust.yml
  java-ci:
    needs: changelog
    uses: ./.github/workflows/java25.yml
  cpp-ci:
    needs: changelog
    uses: ./.github/workflows/cpp26.yml
  build-python:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --out-dir ../dist
        working-directory: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: dist/*
  build-rust:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo package -p quantforge-core --locked
        working-directory: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust
          path: rust/target/package/*.crate
  build-java:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: mvn -B -DskipTests package
        working-directory: java25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java
          path: java25/target/quantforge-*.jar
  build-cpp:
    needs: changelog
    runs-on: ubuntu-24.04
    container: gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y cmake ninja-build
      - run: cmake -S cpp26 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel --target quantforge
      - env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          cp LICENSE build/
          tar -czf "quantforge-cli-${VERSION}-linux-x86_64.tar.gz" -C build quantforge LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp
          path: quantforge-cli-*.tar.gz
  release:
    needs: [changelog, python-ci, rust-ci, java-ci, cpp-ci, build-python, build-rust, build-java, build-cpp]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -R out
          cd out
          sha256sum python/* rust/* java/* cpp/* | sed 's#  [a-z]*/#  #' > SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --title "QuantForge $TAG" --notes-file notes/notes.md --verify-tag \
            python/* rust/* java/* cpp/* SHA256SUMS
