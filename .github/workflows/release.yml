name: Release
# Runs on a vMAJOR.MINOR.PATCH tag (plan 13.1 E3; tags are semver from v0.5.0). It reruns the language CI, builds the
# artefacts, refuses a version that has no CHANGELOG.md section, and creates the GitHub release with GITHUB_TOKEN.
# Every asset gets a signed SLSA provenance attestation, and a CycloneDX SBOM ships with them (plan 12.2 G3).
# The release notes end with the repository's CI minutes over the last 7 days (plan 13.2 E10).
# Nothing is published to a package registry.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${BASH_REMATCH[1]}"
          grep -Eq "^## ${version//./\\.}([: ]|$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${version}' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The section's text, up to the next "## " heading, becomes the release notes
          awk -v h="## $version" '/^## / { if (on) exit; c = substr($0, length(h) + 1, 1); if (index($0, h) == 1 && (c == "" || c == ":" || c == " ")) on = 1 } on' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
  python-ci:
    needs: changelog
    uses: ./.github/workflows/python.yml
  rust-ci:
    needs: changelog
    uses: ./.github/workflows/rust.yml
  java-ci:
    needs: changelog
    uses: ./.github/workflows/java25.yml
  cpp-ci:
    needs: changelog
    uses: ./.github/workflows/cpp26.yml
  build-python:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --out-dir ../dist
        working-directory: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: dist/*
  build-rust:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release ships the Rust CLI binary, like C++. A source crate cannot be packaged yet: the core library
      # reads data files from specifications/ outside the crate. Registry publishing is plan item 12.7 G3b (stage K).
      - run: cargo build --release --locked -p quantforge-cli
        working-directory: rust
      - env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          cp LICENSE rust/target/release/
          tar -czf "quantforge-rust-cli-${VERSION}-linux-x86_64.tar.gz" -C rust/target/release quantforge LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust
          path: quantforge-rust-cli-*.tar.gz
  build-java:
    needs: changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5"
      - run: mvn -B -DskipTests package
        working-directory: java25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java
          path: java25/target/quantforge-*.jar
  build-cpp:
    needs: changelog
    runs-on: ubuntu-24.04
    container: gcc:16.2@sha256:9af8c7003ad451f09496c7182f320c58554e10ec080e7038e0aa5e41146c916b
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update && apt-get install -y cmake ninja-build
      - run: cmake -S cpp26 -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel --target quantforge
      - env:
          VERSION: ${{ needs.changelog.outputs.version }}
        run: |
          cp LICENSE build/
          tar -czf "quantforge-cli-${VERSION}-linux-x86_64.tar.gz" -C build quantforge LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp
          path: quantforge-cli-*.tar.gz
  release:
    needs: [changelog, python-ci, rust-ci, java-ci, cpp-ci, build-python, build-rust, build-java, build-cpp]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write      # signs the provenance attestation (Sigstore, free for public repositories)
      attestations: write
      actions: read        # CI minutes per week for the release notes (plan 13.2 E10)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
      # CycloneDX SBOM of the source tree's lockfiles (Cargo.lock, uv.lock, pom.xml) (plan 12.2 G3)
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: src
          format: cyclonedx-json
          output-file: out/quantforge-${{ needs.changelog.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # SLSA build provenance for every asset; check one with: gh attestation verify FILE --repo AshJha0/quantforge
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/python/*
            out/rust/*
            out/java/*
            out/cpp/*
            out/*.cdx.json
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 src/tools/ci_minutes.py --repo "$REPO" --days 7 >> out/notes/notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -R out
          cd out
          sha256sum python/* rust/* java/* cpp/* ./*.cdx.json | sed -E 's#  (\./|[a-z]+/)#  #' > SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --title "QuantForge $TAG" --notes-file notes/notes.md --verify-tag \
            python/* rust/* java/* cpp/* ./*.cdx.json SHA256SUMS
