name: Curve daily
# Daily curve run (stage K item K-11; specifications/12-platform/daily-curve-run.md, rulings KR-90 onwards). It
# fetches the US Treasury daily par yield file and the Federal Reserve's GSW file (feds200628.csv), fits the
# library's Nelson-Siegel operation through the Python CLI, and appends hash-chained rows to branch curve-daily:
# fitted parameters, fit diagnostics, input hashes, code commit and contract version. No raw file is committed
# or uploaded as an artifact; the downloads stay in memory on the runner. Every date is checked against the
# prereg holdout windows. The head is anchored on branch curve-daily-anchors. It never writes to main.
# All numerical work is in tools/curve_daily/ and the library; this file only checks out, runs and pushes.
on:
  schedule:
    - cron: '45 23 * * 1-5' # after Treasury's end-of-day par curve (usually by 6:00 PM ET, 23:00 UTC in winter)
    - cron: '15 14 * * 2-6' # second chance next morning, still before the 19:30 UTC on-time cut-off (KR-95)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch, fit and verify, print the rows, push nothing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: curve-daily
  cancel-in-progress: false
jobs:
  curves:
    name: curve-daily-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: code
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check out curve-daily, or start it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" curve-daily >/dev/null; then
            git clone --quiet --branch curve-daily "$url" ledger
          else
            git init -b curve-daily ledger
            git -C ledger remote add origin "$url"
            printf '# curve-daily\n\nRows written by .github/workflows/curve-daily.yml. Append-only. Fitted parameters, diagnostics and input hashes only; no source rows. Sources: US Department of the Treasury; Board of Governors of the Federal Reserve System (GSW). See specifications/12-platform/daily-curve-run.md on main.\n' > ledger/README.md
          fi
      - name: Install the Python CLI
        run: uv sync --locked --no-dev --project code/python
      - name: Run the day
        # Exit 2: rows were written and one records a problem (gap, failed fetch or fit, stale input, holdout
        # block); they are still verified and pushed, and the last step turns the run red. Exit 1: refused,
        # nothing written.
        id: run
        continue-on-error: true
        run: |
          args=(--ledger ledger/ledger/curves.jsonl --impl python --commit "$GITHUB_SHA" --summary ledger/ledger/summary.json)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 code/tools/curve_daily/run_day.py "${args[@]}"
      - name: Check out the anchors, or start them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" curve-daily-anchors >/dev/null; then
            git clone --quiet --branch curve-daily-anchors "$url" anchors
          else
            git init -b curve-daily-anchors anchors && git -C anchors remote add origin "$url"
            printf '# curve-daily-anchors\n\nOpenTimestamps anchors for branch curve-daily. See specifications/12-platform/daily-curve-run.md on main.\n' > anchors/README.md
          fi
          mkdir -p anchors/anchors
      - name: Verify the ledger and every anchor held
        # Chain, configuration, row rules, holdout windows (plan 14.10 rule 6), calendar and anchors. A ledger
        # that fails here is not pushed.
        if: hashFiles('ledger/ledger/curves.jsonl') != ''
        run: python3 code/tools/curve_daily/verify_chain.py verify --ledger ledger/ledger/curves.jsonl --impl python --anchors anchors/anchors --summary ledger/ledger/summary.json
      - name: Push rows
        id: push
        if: env.DRY_RUN != 'true' && hashFiles('ledger/ledger/curves.jsonl') != ''
        env:
          # Same optional signing key as recorder.yml; without the secret (forks) rows are pushed unsigned and the
          # dates rest on the anchors.
          SIGNING_KEY: ${{ secrets.FORWARD_LOG_SIGNING_KEY }}
        run: |
          cd ledger
          if [ -n "$SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/cd_sign"; (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
            git config user.name "AshJha0"
            git config user.email "99271665+AshJha0@users.noreply.github.com"
            git config gpg.format ssh
            git config user.signingkey "$key"
            git config commit.gpgsign true
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A
          git diff --cached --quiet && exit 0
          head=$(python3 -c "import json; print(json.load(open('ledger/summary.json'))['head'])")
          git commit -q -m "curve-daily: $(date -u +%Y-%m-%dT%H:%MZ) head ${head} (main ${GITHUB_SHA::7})"
          # No rebase on a rejected push: this job is the only writer and the concurrency group serialises it, so a
          # rejection means the branch changed underneath and a person must look.
          git push origin curve-daily
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Anchor the head hash outside the repo
        # As recorder.yml (plan 13.2 R4): OpenTimestamps on free calendars, no account, no secret.
        id: anchor
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          pip install --quiet opentimestamps-client==0.7.2
          (cd anchors/anchors && ots upgrade *.json.ots || true) # fills in Bitcoin attestations once confirmed
          python3 code/tools/curve_daily/verify_chain.py anchor --ledger ledger/ledger/curves.jsonl --out-dir anchors/anchors --stamp
          cd anchors
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "anchor: $(date -u +%Y-%m-%dT%H:%MZ) curve-daily head $(git -C ../ledger rev-parse --short HEAD)"
          for i in 1 2 3; do git push origin curve-daily-anchors && break; git pull --rebase -q origin curve-daily-anchors; done
      - name: Fail on a failed soft step
        if: always()
        env:
          OUTCOMES: run=${{ steps.run.outcome }} anchor=${{ steps.anchor.outcome }}
        run: |
          failed=""
          for kv in $OUTCOMES; do if [ "${kv#*=}" = failure ]; then failed="$failed ${kv%%=*}"; fi; done
          if [ -n "$failed" ]; then
            echo "::error::soft steps failed:$failed (run: refused, or a row records a gap, failed fetch or fit, stale input or holdout block; see the step log and ledger/curves.jsonl on branch curve-daily. anchor: rows pushed but the head was not stamped; the next run stamps a later head)"
            exit 1
          fi
          echo "all soft steps passed or were skipped ($OUTCOMES)"
