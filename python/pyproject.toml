[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-core"
version = "0.3.0"
description = "Quantitative analytics and trading infrastructure"
requires-python = "==3.15.*"
dependencies = ["numpy>=2.0"]

[project.scripts]
quantforge = "quantforge_core.cli.main:main"

[dependency-groups]
dev = ["scipy>=1.13", "pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantforge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.mutmut]
source_paths = ["quantforge_core/"]
# The other test files read files outside the copy of python/ that mutmut makes.
tests_dir = ["tests/test_core.py"]
pytest_add_cli_args = ["--deselect=tests/test_core.py::test_sobol_table_equals_the_spec_data"]
do_not_mutate = ["quantforge_core/_sobol_data.py"]
