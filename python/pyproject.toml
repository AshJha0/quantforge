[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-core"
version = "0.5.0"
description = "Quantitative analytics and trading infrastructure"
requires-python = "==3.15.*"
dependencies = ["numpy>=2.0"]

[project.scripts]
quantforge = "quantforge_core.cli.main:main"

[dependency-groups]
dev = ["scipy>=1.13", "pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "scipy-stubs>=1.13", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantforge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.mutmut]
source_paths = ["quantforge_core/"]
# Every unit test file. test_conformance.py is left out: it reads datasets/ outside the copy
# of python/ that mutmut makes. test_core.py reads one spec file, deselected below.
tests_dir = ["tests/test_core.py", "tests/test_cli.py", "tests/test_stage_b.py",
             "tests/test_stage_c.py", "tests/test_stage_d.py", "tests/test_stage_d2.py",
             "tests/test_stage_d3.py", "tests/test_stage_d_rulings.py", "tests/test_typing_paths.py",
             "tests/test_r1.py", "tests/test_r2.py", "tests/test_fast_paths.py",
             "tests/test_goldens_stage_d.py", "tests/test_stage_e.py",
             "tests/test_stage_e2.py", "tests/test_stage_e3.py", "tests/test_stage_e4.py",
             "tests/test_stage_e5.py", "tests/test_stage_e6.py", "tests/test_stage_e8.py"]
pytest_add_cli_args = ["--deselect=tests/test_core.py::test_sobol_table_equals_the_spec_data"]
do_not_mutate = ["quantforge_core/_sobol_data.py", "quantforge_core/_legendre_1024.py"]

[tool.uv]
# A plain path .pth instead of setuptools' import-hook finder: the finder pulls in pathlib and
# importlib.util at every interpreter start, about 0.1 s of T4 on the reference laptop.
config-settings = { editable_mode = "compat" }
